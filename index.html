<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./src/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Interactive card details form</title>

  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* BACKGROUNDS */
    .bg-main {
      background-image: url('./images/bg-main-mobile.png');
      background-size: cover;
      background-position: center;
    }
    @media (min-width: 768px) {
      .bg-main {
        background-image: url('./images/bg-main-desktop.png');
        background-size: cover;
      
      }
    }

  </style>
</head>

<body class="min-h-screen md:items-stretch  bg-white flex flex-col md:flex-row">

  <!-- LEFTSIDE -->
   <div class="bg-main relative h-[240px] w-full md:w-[483px] md:min-h-screen md:self-stretch  flex-shrink-0">
    <!-- BACK CARD -->
    <div class="absolute rounded-xl shadow-xl z-10 w-[285px] h-[157px] top-[20px] right-[16px] md:w-[447px] md:h-[245px] md:top-[340px] md:right-[-100px]"
         style="background-image: url('./images/bg-card-back.png'); background-size: cover;">
      <span id="card-cvc-display" class="absolute top-[67px] right-[30px] md:top-[105px] md:right-[48px] text-white text-[14px] md:text-[25px] tracking-[3px]">
        000 </span>
    </div>

    <!-- FRONT CARD -->
    <div class="absolute rounded-xl shadow-xl z-20 w-[285px] h-[157px] top-[90px] left-[16px] md:w-[447px] md:h-[245px] md:top-[60px] md:left-[100px] p-4 md:p-7 flex flex-col justify-between"
         style="background-image: url('./images/bg-card-front.png'); background-size: cover;">

      <img src="./images/card-logo.svg" alt="Card Logo" class="w-[54px] md:w-[84px]">

      <div>
        <p id="card-number-display" class="text-white tracking-[2px] md:tracking-[4px] text-[14px] md:text-[27px] mb-2 md:mb-5">
          0000 0000 0000 0000
        </p>
        <div class="flex justify-between items-center">
          <span id="card-name-display" class="text-white uppercase tracking-[2px] text-[10px] md:text-[14px]">
            JANE APPLESEED
          </span>
          <span id="card-exp-display" class="text-white tracking-[2px] text-[10px] md:text-[14px]">  00/00
          </span>
        </div>
      </div>

    </div>

  </div>

  <!-- RIGHTSIDE: FORM -->
  <section class="flex-1 flex items-center justify-center pt-[100px] pb-[200px] px-6 md:pt-[100px] md:pb-[0]">

    <!-- FORM STATE -->
    <div id="form-state" class="w-full max-w-[380px]">
      <form id="card-form" novalidate>

        <!-- Cardholder Name -->
        <div class="mb-5">
          <label for="cardholder-name"
                 class="block text-[11px] tracking-[2px] text-purple-900 font-medium mb-2">
            CARDHOLDER NAME
          </label>
          <input type="text" id="cardholder-name"
                 placeholder="e.g. Jane Appleseed"
                 class="input-field w-full h-11 px-4 rounded-lg border border-gray-200
                        text-purple-950 text-sm placeholder:text-gray-400">
          <span id="error-name" class="error-text hidden"></span>
        </div>

        <!-- Card Number -->
        <div class="mb-5">
          <label for="card-number"
                 class="block text-[11px] tracking-[2px] text-purple-950 font-medium mb-2">
            CARD NUMBER
          </label>
          <input type="text" id="card-number" placeholder="e.g. 1234 5678 9123 0000" maxlength="19" class="input-field w-full h-11 px-4 rounded-lg border border-gray-200 text-purple-950 text-sm placeholder:text-gray-400">
          <span id="error-number" class="error-text hidden"></span>
        </div>

        <!-- Expiry + CVC -->
        <div class="flex gap-4 mb-6">

          <div class="flex-1">
            <label class="block text-[11px] tracking-[2px] text-purple-950 font-medium mb-2">
              EXP. DATE (MM/YY)
            </label>
            <div class="flex gap-2">
              <input type="text" id="exp-month"   placeholder="MM" maxlength="2" class="input-field w-full h-11 px-3 rounded-lg border border-gray-300
                            text-purple-900 text-sm placeholder:text-gray-400">
              <input type="text" id="exp-year"
                     placeholder="YY" maxlength="2"
                     class="input-field w-full h-11 px-3 rounded-lg border border-gray-300
                            text-purple-950 text-sm placeholder:text-gray-400">
            </div>
            <span id="error-exp" class="error-text hidden"></span>
          </div>

          <div class="flex-1">
            <label for="cvc"
                   class="block text-[11px] tracking-[2px] text-purple-950 font-medium mb-2">
              CVC
            </label>
            <input type="text" id="cvc"
                   placeholder="e.g. 123" maxlength="3"
                   class="input-field w-full h-11 px-4 rounded-lg border border-gray-300
                          text-purple-950 text-sm placeholder:text-gray-400">
            <span id="error-cvc" class="error-text hidden"></span>
          </div>

        </div>

        <button type="submit"
                class="w-full h-[53px] bg-purple-950 text-white rounded-lg text-4 hover:opacity-80 transition-opacity duration-200">
          Confirm
        </button>

      </form>
    </div>

    <!-- COMPLETE STATE (shown by JS) -->
    <div id="complete-state" class="hidden w-full max-w-[380px] flex flex-col items-center gap-4 text-center">
      <img src="./images/icon-complete.svg" alt="Complete" class="w-20 mb-2">
      <h2 class="text-2xl tracking-[4px] text-[#21092f] uppercase">Thank You!</h2>
      <p class="text-[#8f8694] text-base">We've added your card details</p>
      <button id="continue-btn" class="w-full h-[53px] bg-[#21092f] text-white rounded-lg text-base mt-4 hover:opacity-80 transition-opacity duration-200">
        Continue
      </button>
    </div>

  </section>
<script src="script.js">

</script>
</body>
</html>
