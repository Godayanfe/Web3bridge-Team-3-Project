<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./src/output.css" />

    <title>Frontend Mentor | Interactive card details form</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <!-- <div class="frontcard bg-amber-200 h-7">
      0000 0000 0000 0000 Jane Appleseed 00/00
    </div>

    000 Cardholder Name e.g. Jane Appleseed Card Number e.g. 1234 5678 9123 0000
    Exp. Date (MM/YY) MM YY CVC e.g. 123 Confirm -->

    <!-- Background -->

    <div class="flex items-center justify-start min-h-screen translate-x-100">
      <div
        class="relative w-111.75 h-61.75 rounded-[10px] overflow-hidden bg-linear-to from-[#f5f5f7] to-[#d9d9df] shadow-2xl"
      >
        <!-- Black strip -->
        <div class="absolute top-5.75 left-0 w-full h-13.5 bg-[#2f2f2f]"></div>

        <!-- Grey cvc section -->
        <div
          class="absolute top-26.25 left-8.75 w-94.25 h-9.5 bg-gray-400 rounded-sm flex items-center justify-end pr-4"
        >
          <span class="text-white text-[14px] tracking-[2px] font-medium">
            000
          </span>
        </div>

        <!-- Bottom fake text -->
        <div
          class="absolute bottom-12 left-1/2 -translate-x-1/2 flex flex-col gap-2 items-center"
        >
          <div class="flex gap-2">
            <div class="w-22.5 h-1 bg-gray-300 rounded-full"></div>
            <div class="w-13 h-1 bg-gray-300 rounded-full"></div>
            <div class="w-10.5 h-1 bg-gray-300 rounded-full"></div>
            <div class="w-2.5 h-1 bg-gray-300 rounded-full"></div>
          </div>

          <div class="flex gap-2">
            <div class="w-6.25 h-1 bg-gray-300 rounded-full"></div>
            <div class="w-13 h-1 bg-gray-300 rounded-full"></div>
            <div class="w-13 h-1 bg-gray-300 rounded-full"></div>
            <div class="w-2.5 h-1 bg-gray-300 rounded-full"></div>
          </div>

          <div class="flex gap-2">
            <div class="w-2.5 h-1 bg-gray-300 rounded-full"></div>
            <div class="w-10.5 h-1 bg-gray-300 rounded-full"></div>
            <div class="w-13 h-1 bg-gray-300 rounded-full"></div>
            <div class="w-22.5 h-1 bg-gray-300 rounded-full"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Completed state start -->

    Thank you! We've added your card details Continue

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
